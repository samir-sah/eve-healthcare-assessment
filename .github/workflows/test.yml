name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eve_user
          POSTGRES_PASSWORD: eve_password
          POSTGRES_DB: eve_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eve_user -d eve_booking"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://eve_user:eve_password@localhost:5432/eve_booking
      TEST_DATABASE_URL: postgresql+psycopg://eve_user:eve_password@localhost:5432/eve_booking_test
      JWT_SECRET: ci-jwt-secret-that-is-at-least-32-characters
      WEBHOOK_SECRET: test-webhook-secret-that-is-at-least-32-chars
      SEED_STAFF_EMAIL: staff@example.com
      SEED_STAFF_PASSWORD: ci-local-password
      MOCK_PAYMENT_MODE: success
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Create isolated test database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://eve_user:eve_password@localhost:5432/postgres", autocommit=True) as connection:
              connection.execute("CREATE DATABASE eve_booking_test")
          PY
      - name: Migrate and seed application database
        run: |
          python -m alembic upgrade head
          python -m app.seed
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Validate Docker Compose
        run: docker compose config --quiet
